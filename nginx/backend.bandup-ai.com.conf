# ── backend.bandup-ai.com — proxies to uvicorn on port 5000 ──────────────────

server {
    listen 80;
    server_name backend.bandup-ai.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name backend.bandup-ai.com;

    ssl_certificate     /etc/letsencrypt/live/backend.bandup-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.bandup-ai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Limit request body to 10 MB (audio uploads etc.)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for long AI responses
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Stripe webhooks — larger timeout, no buffering
    location /payments/webhook {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
