# ── bandup-ai.com — serves the built React frontend ──────────────────────────

server {
    listen 80;
    server_name bandup-ai.com www.bandup-ai.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bandup-ai.com www.bandup-ai.com;

    # SSL — replace with your cert paths (e.g. from certbot)
    ssl_certificate     /etc/letsencrypt/live/bandup-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bandup-ai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root /home/laplas14/Projects/bandup-ai/band-buddy-connect/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
